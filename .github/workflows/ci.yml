name: ci

# push only: push runs already report on PR head commits, so pull_request would double them.
on:
  push:

permissions:
  contents: read

# Main gets one group per commit: a shared group lets a newer queued run replace an older one.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: control-plane/go.mod
          cache: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - run: make setup
      - run: make lint
      - run: make test
